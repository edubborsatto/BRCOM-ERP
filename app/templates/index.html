<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRCom ERP - Painel de Controle</title>
    <!-- Tailwind CSS para um visual moderno e limpo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- Topbar/Header -->
    <nav class="bg-slate-800 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-boxes-stacked text-2xl text-emerald-400"></i>
            <span class="text-xl font-bold tracking-wider text-emerald-400">BRCom <span class="text-white font-normal">ERP</span></span>
        </div>
        <div class="text-sm bg-slate-700 px-3 py-1.5 rounded-md border border-slate-600">
            <span class="inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full mr-2 animate-pulse"></span>
            Banco de Dados Conectado (Neon)
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Formulário de Cadastro (Lado Esquerdo) -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 lg:col-span-1 h-fit">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center">
                <i class="fa-solid fa-circle-plus text-emerald-500 mr-2"></i>
                Cadastrar Novo Produto
            </h2>
            <form id="productForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Nome do Produto</label>
                    <input type="text" id="nome" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Ex: Cinta de Amarração 5T">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Unid. Medida</label>
                        <select id="unidade_medida" class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="unidade">Unidade</option>
                            <option value="metro">Metro</option>
                            <option value="rolo">Rolo</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Estoque Mínimo</label>
                        <input type="number" id="estoque_minimo" required min="0" value="5" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Qtd. Atual</label>
                        <input type="number" id="quantidade_atual" required min="0" value="10" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Preço Custo (R$)</label>
                        <input type="number" step="0.01" id="preco_custo" required min="0" placeholder="0.00" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Preço Venda (R$)</label>
                    <input type="number" step="0.01" id="preco_venda" required min="0" placeholder="0.00" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-md shadow-md transition duration-200">
                    Salvar no Sistema
                </button>
            </form>
        </div>

        <!-- Tabela de Produtos Cadastrados (Lado Direito) -->
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200 lg:col-span-2">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800 flex items-center">
                    <i class="fa-solid fa-list-check text-emerald-500 mr-2"></i>
                    Produtos no Estoque
                </h2>
                <button onclick="loadProducts()" class="text-gray-500 hover:text-emerald-600 transition">
                    <i class="fa-solid fa-arrows-rotate text-lg"></i>
                </button>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-xs uppercase font-bold border-b border-gray-200">
                            <th class="p-3">ID</th>
                            <th class="p-3">Nome</th>
                            <th class="p-3">Qtd. Atual</th>
                            <th class="p-3">Preço Custo</th>
                            <th class="p-3">Preço Venda</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody" class="text-gray-700 text-sm">
                        <!-- Linhas geradas dinamicamente via JS -->
                    </tbody>
                </table>
                <div id="noProducts" class="hidden text-center py-8 text-gray-400">
                    Nenhum produto cadastrado até o momento.
                </div>
            </div>
        </div>

    </div>

    <!-- Script de Integração com o Backend -->
    <script>
        const API_URL = "http://127.0.0.1:8000/produtos/";

        // Carrega os produtos cadastrados ao abrir a página
        document.addEventListener("DOMContentLoaded", loadProducts);

        async function loadProducts() {
            try {
                const response = await fetch(API_URL);
                const products = await response.json();
                const tableBody = document.getElementById("productTableBody");
                const noProductsDiv = document.getElementById("noProducts");
                
                tableBody.innerHTML = "";

                if (products.length === 0) {
                    noProductsDiv.classList.remove("hidden");
                    return;
                }
                noProductsDiv.classList.add("hidden");

                products.forEach(p => {
                    const row = `
                        <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                            <td class="p-3 font-semibold text-gray-500">#${p.id}</td>
                            <td class="p-3 font-semibold text-gray-800">${p.nome}</td>
                            <td class="p-3">
                                <span class="px-2 py-1 rounded text-xs ${p.quantidade_atual <= p.estoque_minimo ? 'bg-red-100 text-red-700 font-bold' : 'bg-emerald-100 text-emerald-800'}">
                                    ${p.quantidade_atual} ${p.unidade_medida}
                                </span>
                            </td>
                            <td class="p-3 text-gray-600">R$ ${p.preco_custo.toFixed(2)}</td>
                            <td class="p-3 font-semibold text-emerald-600">R$ ${p.preco_venda.toFixed(2)}</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Erro ao buscar produtos:", error);
            }
        }

        // Submete o formulário via Ajax para o Backend
        document.getElementById("productForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const productData = {
                nome: document.getElementById("nome").value,
                unidade_medida: document.getElementById("unidade_medida").value,
                quantidade_atual: parseFloat(document.getElementById("quantidade_atual").value),
                estoque_minimo: parseFloat(document.getElementById("estoque_minimo").value),
                preco_custo: parseFloat(document.getElementById("preco_custo").value),
                preco_venda: parseFloat(document.getElementById("preco_venda").value)
            };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(productData)
                });

                if (response.ok) {
                    alert("Produto cadastrado com sucesso!");
                    document.getElementById("productForm").reset();
                    loadProducts(); // Recarrega a tabela na hora
                } else {
                    const err = await response.json();
                    alert("Erro: " + (err.detail || "Não foi possível cadastrar."));
                }
            } catch (error) {
                alert("Erro ao conectar com o servidor.");
            }
        });
    </script>
</body>
</html>
